<title>Amane CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Jost:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Maison : ivoire et noir comme le site, champagne en accent ; rail à gauche, panneaux blancs, tiroir latéral pour les fiches. */
:root{
  --bg:#FAF8F4; --bg2:#F3EFE8; --glass:#FFFFFF; --glass-2:rgba(17,17,17,.035); --line:rgba(17,17,17,.16); --line-2:rgba(17,17,17,.08);
  --fg:#111111; --fg-2:#4A443E; --fg-3:#6E675F; --accent:#8A6A3B; --accent-ink:#FFFFFF; --bx:#111111; --bx-deep:#111111; --bx-soft:rgba(17,17,17,.06);
  --ok:#3E7A4E; --warn:#8A5A12; --bad:#A3293F; --info:#3D5F87;
  --glow:transparent; --glow-2:transparent; --shadow:0 1px 2px rgba(17,17,17,.04),0 14px 34px -22px rgba(17,17,17,.22);
  --win:#EDE7DD; --win-2:#E2DACD; --sil:rgba(17,17,17,.55); --bar-bg:rgba(17,17,17,.08); --bar-fg:#111111; --strip:#111111; --scrim:rgba(17,17,17,.38);
  --f-display:'Bodoni Moda',Didot,'Times New Roman',serif; --f-ui:'Jost','Futura','Century Gothic',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r:12px; --rail:84px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111111; --bg2:#0B0B0B; --glass:rgba(250,248,244,.045); --glass-2:rgba(250,248,244,.06); --line:rgba(250,248,244,.16); --line-2:rgba(250,248,244,.09);
  --fg:#F4F1EC; --fg-2:#CFC8BE; --fg-3:#A39B90; --accent:#C9A56A; --accent-ink:#111111; --bx:#F4F1EC; --bx-deep:#F4F1EC; --bx-soft:rgba(250,248,244,.08);
  --ok:#9FBF9A; --warn:#E2BC72; --bad:#F09AA6; --info:#B4C6DE; --shadow:0 20px 50px -28px rgba(0,0,0,.8);
  --win:#1C1B19; --win-2:#121110; --sil:rgba(250,248,244,.7); --bar-bg:rgba(250,248,244,.12); --bar-fg:#F4F1EC; --strip:#F4F1EC; --scrim:rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111111; --bg2:#0B0B0B; --glass:rgba(250,248,244,.045); --glass-2:rgba(250,248,244,.06); --line:rgba(250,248,244,.16); --line-2:rgba(250,248,244,.09);
  --fg:#F4F1EC; --fg-2:#CFC8BE; --fg-3:#A39B90; --accent:#C9A56A; --accent-ink:#111111; --bx:#F4F1EC; --bx-deep:#F4F1EC; --bx-soft:rgba(250,248,244,.08);
  --ok:#9FBF9A; --warn:#E2BC72; --bad:#F09AA6; --info:#B4C6DE; --shadow:0 20px 50px -28px rgba(0,0,0,.8);
  --win:#1C1B19; --win-2:#121110; --sil:rgba(250,248,244,.7); --bar-bg:rgba(250,248,244,.12); --bar-fg:#F4F1EC; --strip:#F4F1EC; --scrim:rgba(0,0,0,.6);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-weight:400;font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ambient{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.ambient .orb{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(80px);opacity:.9}
.ambient .o1{background:radial-gradient(circle,var(--glow),transparent 62%);left:-25vmax;top:-30vmax;animation:drift 38s ease-in-out infinite alternate}
.ambient .o2{background:radial-gradient(circle,var(--glow-2),transparent 60%);right:-30vmax;bottom:-35vmax;animation:drift 46s ease-in-out infinite alternate-reverse}
.ambient{display:none}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.08)}}
@media (prefers-reduced-motion:reduce){.ambient .orb{animation:none}*{transition:none!important;animation:none!important}}

/* Rail */
.rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail);z-index:30;display:flex;flex-direction:column;align-items:center;gap:6px;padding:calc(18px + env(safe-area-inset-top,0px)) 0 calc(18px + env(safe-area-inset-bottom,0px)) env(safe-area-inset-left,0px);border-right:1px solid var(--line-2);background:var(--bg2)}
.rail .brand{width:44px;height:52px;color:var(--accent);margin-bottom:18px;display:grid;place-items:center}
.rail .brand svg{width:40px;height:auto}
.nav-btn{width:64px;border:0;background:none;color:var(--fg-3);display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0 7px;border-radius:12px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;position:relative;transition:color .2s,background .2s}
.nav-btn svg{width:21px;height:21px}
.nav-btn:hover{color:var(--fg)}
.nav-btn[aria-current="page"]{color:var(--fg);background:var(--glass-2)}
.nav-btn[aria-current="page"]::before{content:"";position:absolute;left:-10px;top:12px;bottom:12px;width:2px;border-radius:2px;background:var(--accent)}
.nav-btn .dot{position:absolute;top:6px;right:12px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-size:10px;line-height:16px;font-family:var(--f-mono);letter-spacing:0}
.rail .spacer{flex:1}
.help-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line-2);background:var(--glass);display:grid;place-items:center;font-family:var(--f-display);font-size:20px;color:var(--fg-2);backdrop-filter:blur(14px);flex:0 0 auto}
.help-btn:hover{border-color:var(--accent);color:var(--fg)}
.aide{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px}
.aide .steps-a{display:flex;flex-direction:column}
.aide .st-a{display:grid;grid-template-columns:48px minmax(0,1fr);gap:16px;padding:16px 0;border-top:1px solid var(--line-2)}
.aide .st-a:first-child{border-top:0;padding-top:4px}
.aide .st-a .n{width:40px;height:48px;border-radius:20px 20px 4px 4px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:19px;color:var(--accent)}
.aide .st-a h3{margin:0 0 4px;font-family:var(--f-display);font-weight:400;font-size:19px}
.aide .st-a p{margin:0;color:var(--fg-2);font-size:14px;max-width:62ch}
.aide .st-a .go{margin-top:10px}
.aide .who{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line-2)}
.aide .who:first-of-type{border-top:0}
.aide .who b{font-weight:500;display:block}
.aide .who span{font-size:13px;color:var(--fg-3)}
.aide ul.kb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:14px;color:var(--fg-2)}
.aide ul.kb kbd{font-family:var(--f-mono);font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--fg);margin-right:6px}
.aide .facts{display:flex;flex-direction:column;gap:10px;font-size:14px;color:var(--fg-2)}
.aide .facts div{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px}
.aide .facts i{font-style:normal;color:var(--accent)}
@media (max-width:1100px){.aide{grid-template-columns:1fr}}
.me-btn.av{width:52px;height:60px;border-radius:26px 26px 8px 8px;font-size:22px;border:1px solid rgba(184,149,92,.4)}
.me-btn{width:52px;height:60px;border:1px solid var(--line);background:var(--glass);border-radius:26px 26px 8px 8px;display:grid;place-items:center;font-family:var(--f-display);font-size:22px;color:var(--fg)}

/* Main */
.main{position:relative;z-index:1;margin-left:var(--rail);min-height:100%;padding-block:calc(18px + env(safe-area-inset-top,0px)) 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:26px}
.greet{flex:1;min-width:220px}
.greet .eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--fg-3);display:flex;gap:10px;align-items:center}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--fg-2)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--fg-3)}
.live.on i{background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:ping 2.4s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(127,176,138,.55)}70%{box-shadow:0 0 0 8px rgba(127,176,138,0)}100%{box-shadow:0 0 0 0 rgba(127,176,138,0)}}
.greet h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,3.4vw,44px);line-height:1.05;margin:6px 0 0;text-wrap:balance}
.greet h1 em{font-style:italic;color:var(--accent)}
.search-btn{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;min-width:240px;border-radius:12px;border:1px solid var(--line-2);background:var(--glass);color:var(--fg-3);backdrop-filter:blur(14px)}
.search-btn svg{width:17px;height:17px}
.search-btn kbd{margin-left:auto;font-family:var(--f-mono);font-size:11px;border:1px solid var(--line-2);border-radius:6px;padding:1px 6px}
.btn{height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--glass);display:inline-flex;align-items:center;gap:8px;font-weight:500;letter-spacing:.02em;backdrop-filter:blur(14px);transition:transform .15s,border-color .2s,background .2s;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.98)}
.btn svg{width:17px;height:17px}
.btn.primary{background:var(--fg);border-color:var(--fg);color:var(--bg);box-shadow:none}
.btn.primary:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.gold{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:none;backdrop-filter:none}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:12px;border:1px dashed var(--line);background:var(--glass-2);color:var(--fg-2);margin-bottom:22px;font-size:13.5px}
.banner b{color:var(--fg);font-weight:500}
.banner>svg{width:18px;height:18px;flex:0 0 auto;color:var(--accent)}
.banner>span{flex:1;min-width:200px}
.greet .stats{margin:8px 0 0;color:var(--fg-2);font-size:15px}
.live{white-space:nowrap}

/* Glass card with pointer light */
.glass{position:relative;background:var(--glass);border:1px solid var(--line-2);border-radius:var(--r);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow)}
.glass.lit::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(184,149,92,.13),transparent 45%)}
.glass.lit:hover::after{opacity:1}
.panel{padding:20px 22px}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.panel-h h2,.panel-h h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px}
.panel-h .sub{font-size:12px;color:var(--fg-3);letter-spacing:.06em}
.label{font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--fg-3)}
.view-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.view-h h2{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,3vw,36px);margin:4px 0 0}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;padding:3px;border:1px solid var(--line-2);border-radius:11px;background:var(--glass)}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:13px;color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--bx-soft);color:var(--fg)}
.field-inline{height:36px;border-radius:10px;border:1px solid var(--line-2);background:var(--glass);padding:0 12px;min-width:0}

/* Salon */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{padding:18px 20px 16px;overflow:hidden}
.kpi .v{font-family:var(--f-display);font-size:clamp(28px,2.6vw,38px);line-height:1.1;margin-top:8px}
.kpi .h{font-size:12.5px;color:var(--fg-3);margin-top:4px}
.kpi svg.spark{position:absolute;right:14px;bottom:14px;width:90px;height:34px;opacity:.9}
.grid-salon{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.agenda{display:flex;flex-direction:column}
.ag{display:grid;grid-template-columns:62px 4px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 4px;border-top:1px solid var(--line-2);border-radius:8px;cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.ag:first-child{border-top:0}
.ag:hover{background:var(--glass-2)}
.ag .t{font-family:var(--f-mono);font-size:13px;color:var(--fg-2)}
.ag .bar{height:34px;border-radius:2px;background:var(--accent)}
.ag .ti{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag .meta{font-size:12.5px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day-sep{font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);padding:14px 4px 4px}
.empty{padding:26px 8px;text-align:center;color:var(--fg-3);font-size:13.5px}
.empty .arch{width:46px;height:56px;margin:0 auto 10px;border:1px solid var(--line);border-bottom:0;border-radius:23px 23px 0 0}
.todo-tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.todo-tabs button{border:1px solid var(--line-2);background:none;border-radius:20px;padding:5px 12px 5px 6px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg-2)}
.todo-tabs button[aria-pressed="true"]{border-color:var(--accent);color:var(--fg);background:var(--glass-2)}
.todo-tabs .n{font-family:var(--f-mono);font-size:11px;color:var(--fg-3)}
.todo{display:flex;gap:12px;align-items:flex-start;padding:11px 6px;border-top:1px solid var(--line-2);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;border-radius:6px}
.todo:hover{background:var(--glass-2)}
.todo .sev{flex:0 0 8px;height:8px;border-radius:50%;margin-top:7px}
.todo .tt{font-weight:500}
.todo .td{font-size:12.5px;color:var(--fg-3)}
.fleet-row{display:grid;grid-template-columns:120px minmax(0,1fr) 74px;gap:12px;align-items:center;padding:20px 0 9px;border-top:1px solid var(--line-2)}
.fleet-row:first-of-type{border-top:0}
.fleet-row .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{position:relative;height:10px;border-radius:6px;background:var(--line-2);overflow:visible}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--accent)}
.track .be{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--fg);opacity:.8;border-radius:1px}
.track .be::after{content:attr(data-l);position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:9.5px;color:var(--fg-3);white-space:nowrap;font-family:var(--f-mono)}
.fleet-row .r{text-align:right;font-size:12.5px;color:var(--fg-2)}
.funnel{display:flex;gap:6px;align-items:flex-end;height:110px;margin-top:6px}
.funnel div{flex:1;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,rgba(184,149,92,.45),rgba(184,149,92,.14));position:relative;min-height:6px;border:1px solid rgba(184,149,92,.3)}
.funnel div span{position:absolute;top:-20px;left:0;right:0;text-align:center;font-family:var(--f-mono);font-size:12px;color:var(--fg-2)}
.funnel-l{display:flex;gap:6px;margin-top:8px}
.funnel-l span{flex:1;text-align:center;font-size:10.5px;color:var(--fg-3);letter-spacing:.04em}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:11.5px;letter-spacing:.03em;border:1px solid var(--line-2);color:var(--fg-2);white-space:nowrap}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor}
.c-nouvelle{color:var(--info)} .c-proposition{color:var(--warn)} .c-confirmee{color:var(--ok)} .c-encours{color:var(--accent)} .c-terminee{color:var(--fg-3)} .c-perdue{color:var(--bad)}
.av{width:26px;height:30px;border-radius:13px 13px 4px 4px;display:inline-grid;place-items:center;font-family:var(--f-display);font-size:14px;color:#F6F1E8;flex:0 0 auto}
.av.amel{background:#111111} .av.youssouf{background:#6E675F} .av.aziz{background:#8A6A3B}
.av.none{background:var(--line);color:var(--fg-3)}

/* Kanban */
.kanban{display:grid;grid-template-columns:repeat(6,minmax(240px,1fr));gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.col{display:flex;flex-direction:column;gap:10px;min-height:300px;padding:12px;border-radius:var(--r);background:var(--glass-2);border:1px solid var(--line-2);scroll-snap-align:start;transition:border-color .2s,background .2s}
.col.over{border-color:var(--accent);background:var(--bx-soft)}
.col-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 4px 6px}
.col-h .s{font-family:var(--f-mono);font-size:12px;color:var(--fg-3)}
.card{padding:13px 14px;border-radius:12px;cursor:grab;display:flex;flex-direction:column;gap:8px;transition:transform .18s,border-color .2s}
.card:hover{transform:translateY(-2px);border-color:var(--line)}
.card.dragging{opacity:.35}
.card{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-x pan-y}
.card.ghost{position:fixed;left:0;top:0;z-index:90;margin:0;pointer-events:none;opacity:.96;box-shadow:0 24px 48px -16px rgba(17,17,17,.35);transition:none}
body.is-dragging,body.is-dragging *{cursor:grabbing!important}
body.is-dragging{user-select:none;-webkit-user-select:none}
.mv{display:flex;align-items:center;justify-content:space-between;gap:6px;border-top:1px solid var(--line-2);padding-top:8px;margin-top:2px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--fg-3);opacity:0;transition:opacity .2s}
.card:hover .mv,.card:focus-within .mv{opacity:1}
@media (hover:none){.mv{opacity:1}}
.mv button{width:30px;height:26px;border-radius:8px;border:1px solid var(--line-2);background:var(--bg);color:var(--fg);font-size:15px;line-height:1;cursor:pointer}
.mv button:hover:not([disabled]){border-color:var(--accent)}
.mv button[disabled]{opacity:.3;cursor:default}
.card .ct{font-weight:500;line-height:1.3}
.card .cm{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg-3)}
.card .cm svg{width:14px;height:14px;flex:0 0 auto}
.card .cf{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card .amt{font-family:var(--f-mono);font-size:13px}
.card .ex{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--fg-3)}

/* Table-ish lists */
.list{display:flex;flex-direction:column}
.row{display:grid;align-items:center;gap:14px;padding:13px 16px;border-top:1px solid var(--line-2);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;color:inherit}
.row:first-child{border-top:0}
.row:hover{background:var(--glass-2)}
.row .main-t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub-t{font-size:12.5px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.clients{grid-template-columns:30px minmax(0,1.6fr) minmax(0,1fr) 110px 120px 90px}
.row.contrats{grid-template-columns:minmax(0,1.6fr) repeat(5,minmax(70px,.6fr)) 90px}
.list-h{display:grid;gap:14px;padding:10px 16px;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--fg-3);border-bottom:1px solid var(--line-2)}
.ck{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-3)}
.ck b{width:16px;height:16px;border-radius:5px;border:1px solid var(--line);display:grid;place-items:center;font-weight:400;font-size:11px}
.ck.y{color:var(--ok)} .ck.y b{background:color-mix(in srgb,var(--ok) 22%,transparent);border-color:var(--ok)}
.ck.w{color:var(--warn)} .ck.w b{border-color:var(--warn)}
.prog{height:4px;border-radius:2px;background:var(--line-2);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--accent)}

/* Fleet */
.fleet{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:14px}
.vcard{padding:0;overflow:hidden;cursor:pointer;text-align:left;width:100%;color:inherit;display:flex;flex-direction:column}
.vcard .win{position:relative;height:150px;margin:14px 14px 0;border-radius:110px 110px 10px 10px;overflow:hidden;background:linear-gradient(180deg,var(--win),var(--win-2));border:1px solid rgba(184,149,92,.35)}
.vcard .win svg{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:78%;color:var(--sil)}
.vcard .win .st{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:2}
.vcard .win .st .chip{background:var(--bg2)}
.vcard .win img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.vcard:hover .win img{transform:scale(1.04)}
.vcard .win.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,10,10,.35),transparent 35%,transparent 60%,rgba(14,10,10,.45));pointer-events:none}
.vcard .win.ph{height:190px}
.vcard .now{font-size:12.5px;color:var(--fg-2);line-height:1.4}
.strip{display:grid;gap:3px}
.strip i{height:14px;border-radius:3px;background:var(--line-2)}
.strip i.b{background:var(--strip)}
.strip i.o{background:repeating-linear-gradient(135deg,var(--bx-soft) 0 3px,transparent 3px 6px);box-shadow:inset 0 0 0 1px var(--bx-soft)}
.strip i.t{box-shadow:inset 0 0 0 1px var(--accent)}
.strip-l{display:flex;justify-content:space-between;font-size:10.5px;color:var(--fg-3);font-family:var(--f-mono);margin-top:-4px}
.avail{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 18px}
.avail label{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--fg-3)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.gal figure{margin:0;position:relative;aspect-ratio:4/3;border-radius:10px;overflow:hidden;border:1px solid var(--line-2)}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal .cover{position:absolute;left:8px;top:8px;background:var(--bg2);color:var(--accent);border-color:var(--accent)}
.gal .acts{position:absolute;left:0;right:0;bottom:0;display:flex;gap:4px;padding:6px;background:linear-gradient(transparent,rgba(0,0,0,.7));justify-content:flex-end}
.gal .acts button{border:0;background:rgba(14,10,10,.75);color:#EFE7DA;border-radius:8px;font-size:11.5px;padding:5px 9px}
.drop{border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--fg-3);display:flex;flex-direction:column;gap:10px;align-items:center}
.drop.over{border-color:var(--accent);background:var(--bx-soft)}
.thumb{width:58px;height:44px;border-radius:22px 22px 4px 4px;overflow:hidden;flex:0 0 auto;background:var(--win);display:grid;place-items:center;color:var(--sil)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:46px}
.now-row{display:flex;align-items:center;gap:12px;padding:9px 4px;border:0;border-top:1px solid var(--line-2);width:100%;background:none;text-align:left;color:inherit;border-radius:6px}
.now-row:first-of-type{border-top:0}
.now-row:hover{background:var(--glass-2)}
.imp-g{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(150px,220px);gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line-2)}
@media (max-width:760px){.imp-g{grid-template-columns:auto minmax(0,1fr)}.imp-g select{grid-column:1/-1}}
.vcard .body{padding:14px 18px 18px;display:flex;flex-direction:column;gap:10px}
.vcard .nm{font-family:var(--f-display);font-size:22px;line-height:1.1}
.vcard .cat{font-size:12px;color:var(--fg-3);letter-spacing:.06em}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.kv div{display:flex;flex-direction:column}
.kv span{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--fg-3)}
.kv b{font-weight:400;font-family:var(--f-mono);font-size:13.5px}

/* Planning */
.plan-wrap{overflow-x:auto}
.plan{min-width:900px}
.plan-h,.plan-r{display:grid;grid-template-columns:170px repeat(7,minmax(0,1fr))}
.plan-h div{padding:10px 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3);border-bottom:1px solid var(--line-2)}
.plan-h div.today{color:var(--accent)}
.plan-r{border-bottom:1px solid var(--line-2);position:relative}
.plan-r .rl{padding:12px 10px;font-weight:500;font-size:13.5px;border-right:1px solid var(--line-2)}
.plan-r .rl small{display:block;font-weight:400;font-size:11.5px;color:var(--fg-3)}
.plan-r .cell{border-right:1px solid var(--line-2)}
.plan-r .cell.today{background:var(--glass-2)}
.lanes{position:absolute;left:170px;right:0;top:0;bottom:0}
.bar-m{position:absolute;height:28px;border-radius:8px;padding:0 10px;display:flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid rgba(184,149,92,.35);background:var(--bar-bg);color:var(--bar-fg);cursor:pointer}
.bar-m.proposition,.bar-m.nouvelle{background:repeating-linear-gradient(135deg,rgba(184,149,92,.3) 0 8px,rgba(184,149,92,.14) 8px 16px);border-style:dashed}
.bar-m.terminee{opacity:.55}
.bar-m.clash{outline:2px solid var(--bad);outline-offset:1px}

/* Services */
.svc{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.scard{padding:20px;cursor:pointer;text-align:left;width:100%;color:inherit;display:flex;flex-direction:column;gap:10px}
.scard .ic{width:42px;height:50px;border-radius:21px 21px 6px 6px;display:grid;place-items:center;border:1px solid var(--line);color:var(--accent)}
.scard .ic svg{width:20px;height:20px}
.scard h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:21px}
.scard p{margin:0;color:var(--fg-2);font-size:13.5px}
.scard .tf{font-family:var(--f-mono);font-size:12.5px;color:var(--accent)}
.scard .us{font-size:12px;color:var(--fg-3)}

/* Drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(3px);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);z-index:41;background:var(--bg2);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.on{transform:none}
.dr-h{padding:20px 24px 14px;border-bottom:1px solid var(--line-2);display:flex;gap:12px;align-items:flex-start}
.dr-h h2{margin:2px 0 0;font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.15;text-wrap:balance}
.dr-h .x{margin-left:auto;width:38px;height:38px;border-radius:10px;border:1px solid var(--line-2);background:none;display:grid;place-items:center;flex:0 0 auto}
.dr-h .x svg{width:18px;height:18px}
.tabs{display:flex;gap:4px;padding:10px 24px 0;border-bottom:1px solid var(--line-2)}
.tabs button{border:0;background:none;padding:10px 12px;color:var(--fg-3);border-bottom:2px solid transparent;font-size:13.5px}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.dr-b{flex:1;overflow-y:auto;padding:20px 24px 28px;display:flex;flex-direction:column;gap:16px}
.dr-f{padding:14px 24px;border-top:1px solid var(--line-2);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dr-f .grow{flex:1}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--fg-3)}
.f input,.f select,.f textarea{width:100%;min-height:42px;border-radius:10px;border:1px solid var(--line-2);background:var(--glass);padding:9px 12px;color:var(--fg)}
.f textarea{min-height:90px;resize:vertical;line-height:1.5}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--accent)}
.f select option{background:var(--bg2);color:var(--fg)}
.sec-t{font-family:var(--f-display);font-size:18px;margin:6px 0 -4px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:13.5px}
.checks input{accent-color:var(--bx)}
.f.checks{flex-direction:row}
.f input[type="checkbox"]{width:18px;height:18px;min-height:0;padding:0;flex:0 0 auto}
.f.checks label{font-size:13.5px;letter-spacing:0;text-transform:none;color:var(--fg)}
.warn-box{border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.warn-box svg{width:16px;height:16px;flex:0 0 auto;margin-top:2px}
.note-box{border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--fg-2);background:var(--glass-2)}
.hist{display:flex;flex-direction:column}
.hist button{display:flex;justify-content:space-between;gap:10px;padding:10px 4px;border:0;border-top:1px solid var(--line-2);background:none;text-align:left;color:inherit}
.hist button:hover{background:var(--glass-2)}
.confirm{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--bad)}

/* Modal / palette */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:start center;padding:calc(10vh + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));background:var(--scrim);backdrop-filter:blur(6px)}
.modal[hidden]{display:none!important}
.mbox{width:min(680px,100%);max-height:80vh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg2);border:1px solid var(--line);border-radius:18px;box-shadow:0 40px 100px -30px rgba(0,0,0,.8)}
.pal-in{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line-2)}
.pal-in svg{width:18px;height:18px;color:var(--fg-3)}
.pal-in input{flex:1;border:0;background:none;font-size:17px;outline:none}
.pal-list{overflow-y:auto;padding:8px}
.pal-it{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;background:none;border-radius:10px;text-align:left;color:inherit}
.pal-it[aria-selected="true"]{background:var(--bx-soft)}
.pal-it svg{width:17px;height:17px;color:var(--accent);flex:0 0 auto}
.pal-it .k{margin-left:auto;font-size:11px;color:var(--fg-3);letter-spacing:.12em;text-transform:uppercase}
.pal-g{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--fg-3);padding:10px 12px 4px}
.mj-b{padding:20px 22px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.mj-h{display:flex;align-items:center;gap:12px}
.mj-h .orb{width:40px;height:40px;border-radius:50%;background:conic-gradient(from 0deg,var(--fg),var(--accent),var(--bg),var(--fg));animation:spin 6s linear infinite;box-shadow:0 0 30px var(--glow)}
.mj-h .orb.busy{animation-duration:1.2s}
@keyframes spin{to{transform:rotate(360deg)}}
.mj-h h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px}
.mj-res{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mj-res .glass{padding:14px;box-shadow:none}
.mj-res dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px}
.mj-res dt{color:var(--fg-3)}
.mj-res dd{margin:0;min-width:0;overflow-wrap:anywhere}
.reply{white-space:pre-wrap;font-size:13.5px;line-height:1.55}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:70;background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:13.5px;transition:all .25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* Responsive */
@media (max-width:1100px){.grid-salon{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  :root{--rail:0px}
  .rail{top:auto;left:0;right:0;width:auto;height:auto;flex-direction:row;justify-content:space-around;gap:0;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));border-right:0;border-top:1px solid var(--line-2);background:var(--bg2)}
  .rail .brand,.rail .spacer{display:none}
  .nav-btn{width:auto;flex:1;padding:10px 0}

  .me-btn,.me-btn.av{width:38px;height:44px;font-size:17px;border-radius:19px 19px 6px 6px}
  .greet .stats{font-size:13.5px}
  .nav-btn[aria-current="page"]::before{left:30%;right:30%;top:-7px;bottom:auto;width:auto;height:2px}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:110px}
  .search-btn{min-width:0;flex:1}
  .greet{flex-basis:100%}
  .greet .eyebrow{letter-spacing:.18em;font-size:10px;flex-wrap:wrap;gap:6px 10px}
  .topbar{gap:10px}
  .search-btn span.t,.search-btn kbd{display:none}
  .nav-btn[data-route="aide"]{display:none}
  .topbar .btn .t{display:none}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:14px}
  .kpi svg.spark{display:none}
  .fg{grid-template-columns:1fr}
  .row.clients{grid-template-columns:30px minmax(0,1fr) auto}
  .row.clients .hide-m{display:none}
  .row.contrats{grid-template-columns:minmax(0,1fr) auto}
  .row.contrats .hide-m,.list-h.hide-m{display:none}
  .mj-res{grid-template-columns:1fr}
  .kanban{grid-template-columns:repeat(6,minmax(80vw,1fr))}
}

/* Conciergerie : devis, carnet, programme, tâches, journal, finances */
.tabs{overflow-x:auto;scrollbar-width:none;white-space:nowrap}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:0 0 auto}
.ln{display:grid;grid-template-columns:minmax(0,2.4fr) 64px 92px 104px 34px;gap:8px;align-items:center}
.ln input,.ln select{width:100%;min-width:0;min-height:38px;border-radius:10px;border:1px solid var(--line-2);background:var(--glass);padding:7px 9px;color:var(--fg);font-size:13.5px}
.ln input:focus,.ln select:focus{outline:none;border-color:var(--accent)}
.ln select option{background:var(--bg2);color:var(--fg)}
.ln-h{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--fg-3);margin-bottom:-8px}
.ln.pay{grid-template-columns:150px 120px minmax(0,1fr) 34px}
.ln.com{grid-template-columns:minmax(0,1.6fr) 90px 64px 84px 112px 34px}
.ln.com .due{font-size:13px;text-align:right}
.ln.pr{grid-template-columns:190px 130px minmax(0,1fr) 34px}
.ln.pr2{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:6px}
.ln.tk{grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 34px;row-gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line-2)}.ln.tk>input[data-k$=".t"]{grid-column:2/-1}.ln.tk>select{grid-column:2}
.ln.tk.done input[data-k$=".t"]{text-decoration:line-through;color:var(--fg-3)}
.ln input.late{border-color:var(--bad);color:var(--bad)}
.ln.jr{grid-template-columns:190px 130px 90px 100px 34px}
.ln.jr2{grid-template-columns:minmax(0,1fr) auto;margin-top:6px}
.pst{padding:10px 0;border-top:1px solid var(--line-2)}
.pst:first-child{border-top:0}
.jph{display:flex;align-items:center;gap:8px}.jph img{width:44px;height:34px;object-fit:cover;border-radius:6px}
.pvbox:not(:empty){margin-top:8px;padding:10px 12px;border-radius:10px;border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.pst a.btn,#prOutW a.btn{color:var(--fg);text-decoration:none}
.lnk{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font:inherit}
.tkc{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px}
.tkc input{accent-color:var(--fg);width:18px;height:18px}
.x-s{width:34px;height:34px;border-radius:9px;border:1px solid var(--line-2);background:none;display:grid;place-items:center;color:var(--fg-3);cursor:pointer}
.x-s svg{width:14px;height:14px}.x-s:hover{color:var(--bad);border-color:var(--bad)}
.muted-s{font-size:12.5px;color:var(--fg-3);margin:4px 0 0}
.tots{display:grid;gap:4px;margin-left:auto;width:min(320px,100%);padding:12px 14px;border:1px solid var(--line-2);border-radius:12px;background:var(--glass)}
.tots div{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;color:var(--fg-2)}
.tots .g{color:var(--fg);font-weight:500;border-top:1px solid var(--line-2);padding-top:6px;margin-top:2px}
.tots b{font-weight:400}
.doc-h{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:14px;align-items:end}
.doc-n{font-family:var(--f-display);font-size:24px;line-height:1.2}
.f .lab{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--fg-3)}
.seg.wrap{display:flex;flex-wrap:wrap;width:fit-content;max-width:100%}
.row.partners{grid-template-columns:34px minmax(0,1.6fr) minmax(0,1fr) 70px}
.row.fin{grid-template-columns:minmax(0,1fr) 120px 110px}
.ic-s{width:34px;height:34px;border-radius:17px 17px 5px 5px;border:1px solid var(--line);display:grid;place-items:center;color:var(--accent)}.ic-s svg{width:16px;height:16px}
.ex-s{font-size:10px;letter-spacing:.2em;color:var(--fg-3);text-transform:uppercase}
.tagc{display:inline-block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;border:1px solid var(--line);border-radius:10px;padding:1px 7px;margin-left:6px;color:var(--fg-2)}
.fin-k{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:14px}
.bars{display:flex;flex-direction:column;gap:10px}
.bars .b{display:grid;grid-template-columns:140px minmax(0,1fr) 90px;gap:10px;align-items:center;font-size:13px}
.bars .b i{display:block;height:10px;border-radius:5px;background:var(--accent);min-width:2px}
.bars .b span:last-child{text-align:right}
@media (max-width:760px){
  .ln{grid-template-columns:58px minmax(0,1fr) minmax(0,1fr) 34px}
  .ln.pay,.ln.pr{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 34px}
  .ln.com{grid-template-columns:minmax(0,1fr) 58px minmax(0,1fr)}.ln.com .x-s{justify-self:end}
  .ln.pr2{grid-template-columns:1fr 1fr}
  .ln.jr{grid-template-columns:minmax(0,1fr) 72px 84px 34px}

const fmtE=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(+n||0);

const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const sameDay=(a,b)=>a&&b&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
const fmtDay=d=>d?d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'}):'—';

const nowISO=()=>new Date().toISOString();
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const byId=(arr,id)=>arr.find(x=>x.id===id);
const label=(arr,id)=>(byId(arr,id)||{}).label||'—';
const teamOf=id=>byId(TEAM,id);

function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function overlapDays(m,from,to){const a=parse(m.debut),b=parse(m.fin)||a;if(!a)return 0;const s=Math.max(sod(a),sod(from)),e=Math.min(sod(b),sod(to));if(e<s)return 0;return Math.round((e-s)/864e5)+1}
function durDays(m){const a=parse(m.debut),b=parse(m.fin)||a;if(!a)return 0;return Math.max(1,Math.round((sod(b)-sod(a))/864e5)+1)}

/* ---------- État & stockage ---------- */
const COLS=['clients','missions','vehicules','services','partenaires'];
const S={clients:[],missions:[],vehicules:[],services:[],partenaires:[],loaded:new Set(),mode:'boot',me:lsGet('amane.me',''),route:'salon',demoView:false,filters:{mine:false,svc:'',q:'',week:0,todo:''}};

async function save(col,obj){
  if(obj._demo){toast('Exemple en lecture seule — créez votre propre fiche.');return null}
  const id=obj.id||uid();const body={...obj};delete body.id;body.updatedAt=nowISO();if(!body.createdAt)body.createdAt=body.updatedAt;
  if(db){try{await db.collection(col).doc(id).set(body)}catch(e){toast(errMsg(e));throw e}
    S[col]=[...S[col].filter(x=>x.id!==id),{id,...body}];refresh()}
  else{mem[col].set(id,{id,...body});S[col]=[...mem[col].values()];refresh()}
  return id;
}
async function remove(col,id){
  if(db){try{await db.collection(col).doc(id).delete()}catch(e){toast(errMsg(e));throw e}
    S[col]=S[col].filter(x=>x.id!==id);refresh()}
  else{mem[col].delete(id);S[col]=[...mem[col].values()];refresh()}
}
function errMsg(e){const c=e&&e.code;return c==='quota_exceeded'?'Base pleine : supprimez des fiches anciennes pour en créer de nouvelles.':c==='invalid_argument'?'Enregistrement refusé : fiche trop volumineuse.':c==='resource_exhausted'?'Trop de modifications d’un coup, réessayez dans un instant.':'Enregistrement impossible pour l’instant. Vérifiez votre connexion.'}

async function boot(){
  const C=window.claude;
  render();

    try{db=await C.use('db')}catch(e){db=null}

    C.use('assets').then(x=>{assets=x;refresh()}).catch(()=>{});

  if(db){
    S.mode='live';
    COLS.forEach(c=>db.collection(c).onSnapshot(snap=>{S[c]=snap.docs.map(d=>({id:d.id,...d.data()}));S.loaded.add(c);refresh()},err=>{S.mode='error';refresh()}));

    db=deviceDB();dl=browserDL();
    if(db){S.mode='device';COLS.forEach(c=>db.collection(c).onSnapshot(snap=>{S[c]=snap.docs.map(d=>({id:d.id,...d.data()}));S.loaded.add(c);refresh()}))}

}
/* Hors de claude.ai : base enregistrée dans ce navigateur (localStorage), même interface que la base partagée. */
const DEV_KEY='amane.crm.v1';
/* Premier lancement sur un appareil : la flotte et les services d'Amane, comme dans la base partagée. */
function DEV_SEED(){const t=new Date().toISOString(),w=o=>({...o,createdAt:t,updatedAt:t});return {
  vehicules:{urus:w({nom:'Urus SE',categorie:'Super SUV',tarifJour:1000,loyerMois:2430,chargesMois:500,statut:'disponible',ordre:1}),
    f296:w({nom:'Ferrari 296 GTB',categorie:'Supercar',tarifJour:1300,loyerMois:2240,chargesMois:500,statut:'disponible',ordre:2}),
    g63:w({nom:'G 63',categorie:'SUV',tarifJour:650,loyerMois:1670,chargesMois:500,statut:'disponible',ordre:3}),
    m5:w({nom:'M5 Touring',categorie:'Break sport',tarifJour:450,loyerMois:1480,chargesMois:500,statut:'disponible',ordre:4}),
    classev:w({nom:'Classe V VIP',categorie:'Van 7-8 places',tarifJour:300,loyerMois:930,chargesMois:500,statut:'disponible',ordre:5})},
  services:{location:w({nom:'Voiture d’exception',ordre:1}),chauffeur:w({nom:'Chauffeur VIP',ordre:2}),van:w({nom:'Van VIP',ordre:3}),transfert:w({nom:'Transfert aéroport',ordre:4}),shopping:w({nom:'Personal shopping',ordre:5}),sejour:w({nom:'Séjour clé en main',ordre:6}),conciergerie:w({nom:'Conciergerie sur demande',ordre:7}),clip:w({nom:'Clip souvenir',ordre:8})}}}
function deviceDB(){
  let store;try{const raw=localStorage.getItem(DEV_KEY);store=raw?(JSON.parse(raw)||{}):DEV_SEED();localStorage.setItem(DEV_KEY,JSON.stringify(store))}catch(e){return null}
  const subs={};
  const snap=c=>({docs:Object.entries(store[c]||{}).map(([id,v])=>({id,data:()=>JSON.parse(JSON.stringify(v))}))});
  const emit=c=>(subs[c]||[]).forEach(f=>{try{f(snap(c))}catch(e){}});
  const persist=()=>{try{localStorage.setItem(DEV_KEY,JSON.stringify(store))}catch(e){throw {code:'quota_exceeded'}}};
  window.addEventListener('storage',e=>{if(e.key!==DEV_KEY)return;try{store=JSON.parse(e.newValue||'{}')||{}}catch(x){store={}}Object.keys(subs).forEach(emit)});
  const docRef=(c,id)=>({
    async get(){const v=(store[c]||{})[id];return {exists:!!v,id,data:()=>v?JSON.parse(JSON.stringify(v)):undefined}},
    async set(v){(store[c]=store[c]||{})[id]=JSON.parse(JSON.stringify(v));persist();emit(c)},
    async update(v){(store[c]=store[c]||{})[id]={...(store[c][id]||{}),...JSON.parse(JSON.stringify(v))};persist();emit(c)},
    async delete(){if(store[c]){delete store[c][id];persist();emit(c)}}});
  return {
    collection:c=>({doc:id=>docRef(c,id),onSnapshot(f){(subs[c]=subs[c]||[]).push(f);setTimeout(()=>f(snap(c)),0);return()=>{subs[c]=subs[c].filter(x=>x!==f)}}}),
    doc:path=>{const [c,id]=path.split('/');return docRef(c,id)},
    replaceAll(data){store={};COLS.forEach(c=>{store[c]={};(data[c]||[]).forEach(o=>{if(!o||!o.id||o._demo)return;const b={...o};delete b.id;store[c][o.id]=b})});if(data.meta)store.meta=data.meta;persist();Object.keys(subs).forEach(emit)},
    raw:()=>store};
}
function browserDL(){return {async save({filename,data}){

  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}}}

    if(!data||!COLS.some(c=>Array.isArray(data[c]))){toast('Ce fichier n’est pas une sauvegarde Amane.');return}

  IMP.busy=`0 / ${all}`;impRender();

function readForm(){

async function saveDrawer(){
  readForm();const d=DR.draft,k=DR.kind;
  const col=colOf(k);
  if(k==='partenaire'&&!String(d.nom||'').trim()){toast('Indiquez un nom.');return}
  if(k==='mission'&&!d.titre.trim()){d.titre=`${svcName(d.service)}${clientOf(d)?' — '+clientOf(d).nom:''}`}
  if(k==='client'&&!d.nom.trim()){toast('Indiquez au moins un nom.');return}
  if(k==='vehicule'&&!d.nom.trim()){toast('Indiquez le modèle.');return}
  if(k==='service'){if(!d.nom.trim()){toast('Indiquez un nom.');return}
    if(!S.services.length){for(const s of DEFAULT_SERVICES){if(s.id!==d.id)await save('services',{...s})}}
    if(!d.id)d.id=d.nom.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||uid();}
  if(k==='mission'&&d.fin&&d.debut&&parse(d.fin)<parse(d.debut)){toast('La fin est avant le début.');return}
  if(k==='mission'){
    if(d.chauffeurId){const ch=byId(partners(),d.chauffeurId);if(ch)d.chauffeur=ch.nom}
    d.taches=(d.taches||[]).filter(x=>String(x.t||'').trim());d.programme=(d.programme||[]).filter(x=>x.dt||x.lieu||x.client);
    d.commissions=(d.commissions||[]).filter(c=>c.partenaireId||+c.base);d.commissions.forEach(c=>{if(c.statut==='recue'&&!c.recueLe)c.recueLe=today();if(c.statut!=='recue')delete c.recueLe});
    if(d.devis){const dv=d.devis;dv.lignes=(dv.lignes||[]).filter(l=>String(l.d||'').trim()||+l.pu);dv.paiements=(dv.paiements||[]).filter(q=>+q.montant);if(!dv.date)dv.date=today();
      try{if(!dv.numero)dv.numero=await nextNumero('devis');if(dv.wantFacture&&!dv.factureNumero){dv.factureNumero=await nextNumero('facture');dv.factureDate=today()}}catch(e){toast('Numérotation impossible pour l’instant, réessayez.');return}
      delete dv.wantFacture;const tt=dvTotals(dv);if(dv.lignes.length)d.montant=tt.ttc;if(dv.paiements.length){d.acompte=tt.paid;d.paiement=tt.ttc>0&&tt.paid>=tt.ttc-0.005?'solde':tt.paid>0?'acompte':'non'}}
  }
  if(k==='vehicule'){d.journal=(d.journal||[]).filter(j=>j.dt||j.desc||+j.cout||j.photo)}
  try{const id=await save(col,{...d,id:DR.id||d.id||undefined});if(id){DR.id=id;DR.draft.id=id;toast('Enregistré');if(k==='client'&&DR.pendingMission){const pm=DR.pendingMission;DR.pendingMission=null;openDrawer('mission',null,'main',{...pm,clientId:id});return}drawRender()}}catch(e){}
}

function openMj(){MJ.res=null;MJ.err='';$('#mj').hidden=false;mjRender();setTimeout(()=>{const t=$('#mjIn');t&&t.focus()},30)}
function mjRender(){
  const r=MJ.res;
  $('#mjBody').innerHTML=`<div class="mj-h"><span class="orb ${MJ.busy?'busy':''}"></span><div><h2 id="mjTitle">Majordome</h2><div style="color:var(--fg-3);font-size:13px">Collez un message reçu (WhatsApp, e-mail, Instagram). Il en tire la fiche client, la demande et un brouillon de réponse.</div></div><button class="btn sm ghost" type="button" data-act="mj-close" style="margin-left:auto" aria-label="Fermer">${ico('close')}</button></div>
  <div class="f"><label for="mjIn">Message reçu</label><textarea id="mjIn" style="min-height:130px" placeholder="Ex. Bonjour, je serai à Paris du 12 au 15 avec ma famille au Plaza, nous aimerions un van avec chauffeur et un G 63 pour le samedi soir…">${esc(MJ.text)}</textarea></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm primary" type="button" data-act="mj-run" ${sampleFn&&!MJ.busy?'':'disabled'}>${ico('spark')}${MJ.busy?'Analyse en cours…':'Analyser'}</button>${sampleFn?'':'<span style="color:var(--fg-3);font-size:12.5px;align-self:center">Disponible quand la page est ouverte dans claude.ai.</span>'}</div>
  ${MJ.err?`<div class="warn-box">${ico('alert')}<span>${esc(MJ.err)}</span></div>`:''}
  ${r?`<div class="mj-res"><div class="glass"><div class="label">Client</div><dl>${[['Nom',r.client.nom],['Téléphone',r.client.tel],['E-mail',r.client.email],['Langue',r.client.langue],['Pays',r.client.pays],['Hôtel',r.client.hotel]].filter(x=>x[1]).map(([a,b])=>`<dt>${a}</dt><dd>${esc(b)}</dd>`).join('')}</dl></div>
    <div class="glass"><div class="label">Demande</div><dl>${[['Titre',r.mission.titre],['Service',svcName(r.mission.service)],['Véhicule',r.mission.vehicule],['Début',r.mission.debut&&fmtDT(parse(r.mission.debut))],['Fin',r.mission.fin&&fmtDT(parse(r.mission.fin))],['Lieu',r.mission.lieu],['Budget',r.mission.budget&&fmtE(r.mission.budget)],['Urgence',r.priorite]].filter(x=>x[1]).map(([a,b])=>`<dt>${a}</dt><dd>${esc(b)}</dd>`).join('')}</dl></div></div>
    ${r.reponse?`<div class="glass" style="padding:14px;box-shadow:none"><div class="label">Brouillon de réponse</div><div class="reply" style="margin-top:8px">${esc(r.reponse)}</div></div>`:''}
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm gold" type="button" data-act="mj-create">Créer la fiche et la demande</button>${r.reponse?`<button class="btn sm" type="button" data-act="mj-copy">${ico('copy')}Copier la réponse</button>`:''}</div>`:''}`;
}
async function mjRun(){
  MJ.text=$('#mjIn').value.trim();if(!MJ.text){toast('Collez d’abord un message.');return}
  MJ.busy=true;MJ.err='';MJ.res=null;mjRender();
  const svc=services().map(s=>`${s.id} = ${s.nom}`).join('; ');const vs=vehicles().map(v=>v.nom).join(', ')||'aucun';
  const prompt=`Tu es l'assistant de la conciergerie de luxe Amane à Paris. Aujourd'hui : ${new Date().toLocaleString('fr-FR',{timeZone:'Europe/Paris'})} (Europe/Paris).
Analyse le message client ci-dessous et réponds UNIQUEMENT par un objet JSON de cette forme :
{"client":{"nom":"","tel":"","email":"","langue":"FR|EN|AR|RU|ZH|ES|IT|DE","pays":"","hotel":""},"mission":{"titre":"titre court","service":"un id parmi la liste","vehicule":"nom du véhicule demandé ou vide","debut":"YYYY-MM-DDTHH:MM ou vide","fin":"YYYY-MM-DDTHH:MM ou vide","lieu":"","budget":0,"notes":"détails utiles"},"priorite":"haute|normale|basse","reponse":"brouillon de réponse dans la langue du client"}
Services (id = nom) : ${svc}. Véhicules de la flotte : ${vs}.
Règles : n'invente aucune information absente du message (laisse vide). Dates relatives résolues par rapport à aujourd'hui. La réponse : vouvoiement, sobre et chaleureuse, signée « Amane », sans annoncer de prix, propose un échange pour confirmer les détails.
Message client :
"""${MJ.text}"""`;
  try{const r=await sampleFn.json(prompt,{modelTier:'default'});MJ.res={client:r.client||{},mission:r.mission||{},priorite:r.priorite||'',reponse:r.reponse||''}}
  catch(e){MJ.err=e&&e.code==='not_granted'?'Le majordome n’est pas autorisé sur cette page.':e&&e.code==='rate_limited'?'Trop de demandes : réessayez dans une minute.':'Analyse impossible. Réessayez avec un message plus court.'}
  MJ.busy=false;mjRender();
}
async function mjCreate(){
  const r=MJ.res;if(!r)return;if(S.demoView&&false)return;
  const cs=S.clients;const tel=(r.client.tel||'').replace(/\D/g,'');
  let c=cs.find(x=>tel&&(x.tel||'').replace(/\D/g,'').endsWith(tel.slice(-8)))||cs.find(x=>r.client.nom&&x.nom&&x.nom.toLowerCase()===r.client.nom.toLowerCase());
  let cid=c&&c.id;
  if(!cid){cid=await save('clients',{...blank('client'),nom:r.client.nom||'Client à identifier',tel:r.client.tel||'',email:r.client.email||'',langue:LANGUES.includes(r.client.langue)?r.client.langue:'FR',pays:r.client.pays||'',hotel:r.client.hotel||''})}
  const v=vehicles().find(x=>r.mission.vehicule&&x.nom.toLowerCase().includes(String(r.mission.vehicule).toLowerCase().split(' ')[0]));
  const svcOk=services().some(s=>s.id===r.mission.service);
  const m={...blank('mission'),titre:r.mission.titre||'',clientId:cid,service:svcOk?r.mission.service:'conciergerie',vehiculeId:v?v.id:'',lieu:r.mission.lieu||'',montant:+r.mission.budget||'',notes:[r.mission.notes,r.priorite?'Urgence : '+r.priorite:'','Message d’origine :\n'+MJ.text].filter(Boolean).join('\n\n')};
  if(parse(r.mission.debut))m.debut=r.mission.debut;if(parse(r.mission.fin))m.fin=r.mission.fin;
  const id=await save('missions',m);$('#mj').hidden=true;MJ.text='';if(id){DR.ai=r.reponse||'';openDrawer('mission',id,'main');DR.ai=r.reponse||''}
}
async function aiWrite(){
  readForm();const d=DR.draft,c=byId(list('clients'),d.clientId)||{},v=byId(vehicles(),d.vehiculeId);const type=DR.aiType||'proposition';
  const ta=$('#aiOut');DR.ai='';ta.value='Rédaction…';
  const prompt=`Rédige un message WhatsApp de la conciergerie de luxe Amane (Paris) à un client. Type : ${type}. Langue : ${c.langue||'FR'}. Ton : vouvoiement, sobre, chaleureux, phrases courtes, aucun emoji, signé « Amane ». Ne mentionne un montant que s'il est fourni.
Client : ${c.nom||'[nom]'}. Préférences : ${c.prefs||'—'}.
Prestation : ${svcName(d.service)} — ${d.titre||''}. ${v?'Véhicule : '+v.nom+'.':''} Début : ${d.debut||'—'}. Fin : ${d.fin||'—'}. Lieu : ${d.lieu||'—'}. ${d.montant?'Montant : '+fmtE(d.montant)+'.':''} ${d.acompte?'Acompte reçu : '+fmtE(d.acompte)+'.':''}
Réponds uniquement par le texte du message.`;
  try{const r=await sampleFn(prompt,{modelTier:'default',onText:({text})=>{ta.value=text}});DR.ai=r.text;ta.value=r.text}
  catch(e){DR.ai=e&&e.text||'';ta.value=DR.ai||(e&&e.code==='rate_limited'?'Trop de demandes, réessayez dans une minute.':'Rédaction impossible pour l’instant.')}
}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Copié')}catch(e){toast('Sélectionnez le texte puis copiez-le.')}}

/* ---------- Palette ⌘K ---------- */
const PAL={items:[],i:0};
function openPal(){$('#pal').hidden=false;const inp=$('#palIn');inp.value='';palBuild('');inp.focus()}
function palBuild(q){
  q=q.toLowerCase().trim();const it=[];
  const acts=[['act','new-mission','Nouvelle demande','plus'],['act','mj','Ouvrir le majordome','spark'],['act','new-client','Nouveau client','user'],['act','new-partenaire','Nouveau partenaire','carnet'],['act','new-vehicule','Ajouter un véhicule','flotte'],...ROUTES.map(([k,l])=>['route',k,'Aller à '+l,k])];
  acts.forEach(([t,v,l,ic])=>{if(!q||l.toLowerCase().includes(q))it.push({g:'Actions',t,v,l,ic,k:''})});
  if(q){list('clients').filter(c=>[c.nom,c.tel,c.email,c.hotel].join(' ').toLowerCase().includes(q)).slice(0,6).forEach(c=>it.push({g:'Clients',t:'open',v:'client:'+c.id,l:c.nom,ic:'user',k:label(CLIENT_STATUTS,c.statut)}));
    list('missions').filter(m=>[m.titre,m.lieu,(clientOf(m)||{}).nom].join(' ').toLowerCase().includes(q)).slice(0,6).forEach(m=>it.push({g:'Demandes',t:'open',v:'mission:'+m.id,l:m.titre,ic:SVC_ICON[m.service]||'spark',k:label(STATUTS,m.statut)}));
    partners().filter(p=>[p.nom,p.contact,p.tel,p.langues].join(' ').toLowerCase().includes(q)).slice(0,6).forEach(p=>it.push({g:'Carnet',t:'open',v:'partenaire:'+p.id,l:p.nom,ic:'carnet',k:label(PART_TYPES,p.type)}));
    vehicles().filter(v=>[v.nom,v.plaque].join(' ').toLowerCase().includes(q)).forEach(v=>it.push({g:'Flotte',t:'open',v:'vehicule:'+v.id,l:v.nom,ic:'flotte',k:v.statut}))}
  PAL.items=it;PAL.i=0;palRender();
}
function palRender(){let g='';$('#palList').innerHTML=PAL.items.map((x,i)=>{const h=x.g!==g?`<div class="pal-g">${x.g}</div>`:'';g=x.g;return h+`<button class="pal-it" type="button" role="option" data-pi="${i}" aria-selected="${i===PAL.i}">${ico(x.ic)}<span>${esc(x.l)}</span><span class="k">${esc(x.k)}</span></button>`}).join('')||'<div class="empty">Aucun résultat.</div>'}
function palGo(i){const x=PAL.items[i];if(!x)return;$('#pal').hidden=true;if(x.t==='route')go(x.v);else if(x.t==='open'){const [k,id]=x.v.split(':');openDrawer(k,id)}else act(x.v)}

window.addEventListener('hashchange',()=>{const r=location.hash.slice(1);if(r&&r!==S.route&&ROUTES.some(x=>x[0]===r)){S.route=r;render()}});

  if(a==='new-mission')openDrawer('mission');
  else if(a==='new-client')openDrawer('client');

  else if(a==='new-partenaire')openDrawer('partenaire');

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-pt],[data-fm],[data-move],[data-route],[data-open],[data-act],[data-tab],[data-week],[data-todo],[data-f-mine],[data-pi],[data-who],[data-aitype]');if(!t)return;

  if(t.dataset.pt!==undefined){S.filters.pt=t.dataset.pt;render();return}
  if(t.dataset.fm!==undefined){const f=+t.dataset.fm;S.filters.fm=f===0?0:(S.filters.fm||0)+f;render();return}

  if(t.dataset.open){if(t.classList.contains('card')&&DRAG.suppress)return;const [k,id,tab]=t.dataset.open.split(':');if(DR.open&&k!==DR.kind)readForm();openDrawer(k,id,tab);return}
  if(t.dataset.tab){readForm();DR.tab=t.dataset.tab;drawRender();return}
  if(t.dataset.week){const w=+t.dataset.week;S.filters.week=w===0?0:S.filters.week+w;render();return}
  if(t.dataset.todo){S.filters.todo=t.dataset.todo;render();return}
  if(t.dataset.fMine){S.filters.mine=t.dataset.fMine==='1';render();return}
  if(t.dataset.pi){palGo(+t.dataset.pi);return}
  if(t.dataset.who){S.me=t.dataset.who;lsSet('amane.me',S.me);S.filters.todo='';$('#whoM').hidden=true;render();toast('Bienvenue, '+teamOf(S.me).nom);return}
  if(t.dataset.aitype){readForm();DR.aiType=t.dataset.aitype;DR.ai=($('#aiOut')||{}).value||DR.ai;drawRender();return}
  const a=t.dataset.act;
  if(a==='close')closeDrawer();

  else if(a==='del'){DR.confirmDel=true;readForm();drawRender()}
  else if(a==='del-no'){DR.confirmDel=false;drawRender()}
  else if(a==='del-yes'){await remove(colOf(DR.kind),DR.id);closeDrawer();toast('Supprimé')}
  else if(a==='new-mission-for'){openDrawer('mission',null,'main',{clientId:DR.id})}
  else if(a==='dl-contrat'){readForm();try{await dl.save({filename:`contrat-amane-${(DR.draft.titre||'mission').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').slice(0,40)}.html`,data:contratHTML(DR.draft)})}catch(err){if(err&&err.code!=='cancelled'&&err.code!=='declined')toast('Téléchargement impossible.')}}
  else if(a&&/^(dv|pay|com|pr|tk|jr)-/.test(a)){conciergeAct(a,t)}
  else if(a==='ics')dlSave('amane-planning.ics',planningICS());
  else if(a==='fin-csv'){const ref=monthOf(S.filters.fm||0);dlSave(`amane-finances-${ref.getFullYear()}-${pad(ref.getMonth()+1)}.csv`,finCSV(finData(ref)))}
  else if(a==='import-json')importJSON();
  else if(a==='devnote-ok'){lsSet('amane.devnote','1');refresh()}
  else if(a==='export-json')dlSave(`amane-sauvegarde-${today()}.json`,exportJSON());
  else if(a==='ai-write')aiWrite();
  else if(a==='ai-copy')copyText(($('#aiOut')||{}).value||'');
  else if(a==='mj-close')$('#mj').hidden=true;
  else if(a==='mj-run')mjRun();
  else if(a==='mj-create')mjCreate();
  else if(a==='mj-copy')copyText(MJ.res&&MJ.res.reponse||'');
  else if(a==='who')openWho();
  else if(a==='ph-add')$('#phIn').click();
  else if(a==='imp-dir')$('#impDir').click();
  else if(a==='imp-files')$('#impFiles').click();
  else if(a==='imp-close'){if(!IMP.busy){IMP.groups.forEach(g=>g.url&&URL.revokeObjectURL(g.url));$('#imp').hidden=true}}
  else if(a==='imp-go')impGo();
  else if(a==='ph-cover'){const id=t.dataset.ph;DR.draft.photos=[id,...(DR.draft.photos||[]).filter(x=>x!==id)];persistVeh()}
  else if(a==='ph-del'){const id=t.dataset.ph;DR.draft.photos=(DR.draft.photos||[]).filter(x=>x!==id);await persistVeh();if(assets){try{await assets.delete(id)}catch(_){}}}
  else act(a);
});

document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#pal').hidden?openPal():($('#pal').hidden=true);return}
  if(e.key==='Escape'){if(!$('#pal').hidden)$('#pal').hidden=true;else if(!$('#mj').hidden)$('#mj').hidden=true;else if(!$('#whoM').hidden)$('#whoM').hidden=true;else if(!$('#imp').hidden){if(!IMP.busy)$('#imp').hidden=true}else if(DR.open)closeDrawer();return}
  if(!$('#pal').hidden){if(e.key==='ArrowDown'){e.preventDefault();PAL.i=Math.min(PAL.items.length-1,PAL.i+1);palRender()}else if(e.key==='ArrowUp'){e.preventDefault();PAL.i=Math.max(0,PAL.i-1);palRender()}else if(e.key==='Enter'){e.preventDefault();palGo(PAL.i)}}
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('card')){e.target.click()}
});

/* Actions des onglets conciergerie */
async function conciergeAct(a,t){
  readForm();const d=DR.draft;const i=+t.dataset.i;const demo=!!d._demo;
  if(demo&&!['pr-text','pr-copy','pr-dl','dv-dl'].includes(a)){toast('Exemple en lecture seule — créez votre propre fiche.');return}
  if(a==='dv-new'){d.devis={statut:'brouillon',lignes:dvDefaultLines(d),remise:0,tva:20,paiements:[]};return drawRender()}
  if(a==='dv-add'){d.devis.lignes.push({d:'',q:1,u:'forfait',pu:0});return drawRender()}
  if(a==='dv-del'){d.devis.lignes.splice(i,1);return drawRender()}
  if(a==='dv-fill'){d.devis.lignes=dvDefaultLines(d);return drawRender()}
  if(a==='pay-add'){(d.devis.paiements=d.devis.paiements||[]).push({date:today(),montant:Math.max(0,dvTotals(d.devis).solde),moyen:'virement'});return drawRender()}
  if(a==='pay-del'){d.devis.paiements.splice(i,1);return drawRender()}
  if(a==='dv-facture'){if(!(d.devis.lignes||[]).length){toast('Ajoutez au moins une ligne.');return}d.devis.statut='accepte';d.devis.wantFacture=true;const sel=document.getElementById('f_devis_statut');if(sel)sel.value='accepte';return saveDrawer()}
  if(a==='dv-dl'){const kind=t.dataset.doc;const dv=d.devis||{};const num=kind==='facture'?dv.factureNumero:dv.numero;if(!num){toast('Enregistrez d’abord : le numéro est attribué à l’enregistrement.');return}return dlSave(`${kind}-${num}.html`,devisHTML(d,kind))}
  if(a==='com-add'){(d.commissions=d.commissions||[]).push({partenaireId:'',base:'',pct:'',statut:'a_recevoir'});return drawRender()}
  if(a==='com-del'){d.commissions.splice(i,1);return drawRender()}
  if(a==='pr-add'){const ps=progSteps(d);const last=ps.length?parse(ps[ps.length-1].dt):null;const dt=last?new Date(+last+2*36e5):(parse(d.debut)||new Date());(d.programme=d.programme||[]).push({dt:toLocal(dt),type:'autre',lieu:'',partenaireId:'',client:'',interne:''});return drawRender()}
  if(a==='pr-del'){d.programme.splice(i,1);return drawRender()}
  if(a==='pr-text'){DR.prog=progText(d);drawRender();const o=$('#prOut');if(o)o.focus();return}
  if(a==='pr-copy')return copyText(($('#prOut')||{}).value||DR.prog||'');
  if(a==='pr-dl'){const c=clientOf(d)||{};return dlSave(`carnet-sejour-${slug(c.nom||d.titre)}.html`,carnetHTML(d))}
  if(a==='pr-ai'){if(!sampleFn)return;const c=clientOf(d)||{};const base=progText(d);DR.prog='Rédaction…';drawRender();
    try{const r=await sampleFn(`Réécris ce programme de séjour en message WhatsApp pour le client, dans sa langue (${docLang(c)}), au ton de la conciergerie de luxe Amane : vouvoiement, élégant, sobre, phrases courtes, aucun emoji, garde toutes les heures, lieux et informations exactement, n'invente rien, garde la signature « Amane ». Réponds uniquement par le message.\n\n${base}`,{modelTier:'default'});DR.prog=r.text||base}
    catch(e){DR.prog=base;toast(e&&e.code==='rate_limited'?'Trop de demandes, réessayez dans une minute.':'Rédaction impossible, message standard proposé.')}
    if(DR.open&&DR.tab==='prog')drawRender();return}
  if(a==='tk-add'){(d.taches=d.taches||[]).push({t:'',resp:S.me||'amel',due:(d.debut||'').slice(0,10),fait:false});drawRender();const all=document.querySelectorAll('#drawer [data-k$=".t"]');const last=all[all.length-1];if(last)last.focus();return}
  if(a==='tk-del'){d.taches.splice(i,1);return drawRender()}
  if(a==='tk-tpl'){const have=new Set((d.taches||[]).map(x=>x.t));d.taches=[...(d.taches||[]),...tplTasks(d).filter(x=>!have.has(x.t))];return drawRender()}
  if(a==='jr-add'){(d.journal=d.journal||[]).unshift({dt:toLocal(new Date()),type:'entretien',km:d.km||'',cout:'',desc:''});return drawRender()}
  if(a==='jr-del'){d.journal.splice(i,1);return drawRender()}
  if(a==='jr-ph'){DR.jIdx=i;$('#jIn').click();return}
}
async function journalPhoto(files){files=[...files].filter(isImg);if(!files.length||!assets||!DR.open||DR.kind!=='vehicule')return;readForm();const r=await uploadFiles(files.slice(0,1));if(r.ids[0]&&DR.draft.journal&&DR.draft.journal[DR.jIdx]){DR.draft.journal[DR.jIdx].photo=r.ids[0];await persistVeh();toast('Photo ajoutée au journal')}else toast(upMsg(r))}

  if(key.startsWith('devis.')){readForm();const el=document.getElementById('dvTot');if(el)el.innerHTML=dvTotHTML(DR.draft.devis);return true}
  if(key.startsWith('commissions.')){readForm();if(key.endsWith('.partenaireId')){const i=+key.split('.')[1];const c=DR.draft.commissions[i];const p=byId(partners(),c.partenaireId);if(p&&(c.pct===''||c.pct==null)&&+p.commission){c.pct=+p.commission;const inp=document.querySelector(`#drawer [data-k="commissions.${i}.pct"]`);if(inp)inp.value=c.pct}}
    document.querySelectorAll('#drawer .ln.com').forEach((row,i)=>{const c=DR.draft.commissions[i];const sp=row.querySelector('.due');if(c&&sp)sp.textContent=fmtE2((+c.base||0)*(+c.pct||0)/100)});return true}
  if(key.startsWith('journal.')&&(key.endsWith('.dt')||key.endsWith('.type'))){readForm();const i=+key.split('.')[1];const b=document.getElementById('pv'+i);if(b)b.innerHTML=pvHTML(DR.draft,i);return true}
  if(key.startsWith('taches.')&&key.endsWith('.fait')){readForm();const row=t.closest('.ln.tk');if(row)row.classList.toggle('done',t.checked);if(DR.id&&!DR.draft._demo)saveDrawer();return true}
  return false}
/* Glisser-déposer maison : souris, stylet, et doigt (appui long). Fonctionne dans le lecteur claude.ai. */
const DRAG={el:null,id:null,pid:null,sx:0,sy:0,ox:0,oy:0,started:false,touch:false,timer:0,ghost:null,over:null,suppress:false};
async function moveMission(id,statut){
  const m=byId(list('missions'),id);if(!m||m.statut===statut)return;
  if(m._demo){const dm=DEMO.missions.find(x=>x.id===id);if(dm)dm.statut=statut;refresh();toast(`Exemple déplacé vers « ${label(STATUTS,statut)} » (non enregistré)`);return}
  const nm={...JSON.parse(JSON.stringify(m)),statut};try{await save('missions',nm);toast(`${m.titre} → ${label(STATUTS,statut)}`)}catch(e){}
}
function dragStart(x,y){
  const c=DRAG.el;if(!c||!document.body.contains(c)){DRAG.el=null;return}
  DRAG.started=true;const r=c.getBoundingClientRect();DRAG.ox=x-r.left;DRAG.oy=y-r.top;
  const g=c.cloneNode(true);g.classList.add('ghost');g.classList.remove('lit');g.style.width=r.width+'px';g.removeAttribute('data-open');g.removeAttribute('data-id');document.body.appendChild(g);DRAG.ghost=g;
  c.classList.add('dragging');document.body.classList.add('is-dragging');
  try{c.setPointerCapture(DRAG.pid)}catch(_){}
  if(DRAG.touch&&navigator.vibrate)try{navigator.vibrate(12)}catch(_){}
  dragMove(x,y);
}
function dragMove(x,y){
  if(DRAG.ghost)DRAG.ghost.style.transform=`translate(${x-DRAG.ox}px,${y-DRAG.oy}px) rotate(1.5deg)`;
  const el=document.elementFromPoint(x,y);const col=el&&el.closest?el.closest('.col'):null;
  if(col!==DRAG.over){if(DRAG.over)DRAG.over.classList.remove('over');DRAG.over=col;if(col)col.classList.add('over')}
  const k=document.querySelector('.kanban');if(k){const kr=k.getBoundingClientRect();if(x<kr.left+50)k.scrollLeft-=14;else if(x>kr.right-50)k.scrollLeft+=14}
  if(y<70)window.scrollBy(0,-12);else if(y>innerHeight-70)window.scrollBy(0,12);
}
function dragEnd(){
  if(DRAG.ghost)DRAG.ghost.remove();DRAG.ghost=null;
  if(DRAG.el)DRAG.el.classList.remove('dragging');document.body.classList.remove('is-dragging');
  if(DRAG.over)DRAG.over.classList.remove('over');
  const col=DRAG.over,id=DRAG.id,was=DRAG.started;DRAG.over=null;DRAG.el=null;DRAG.started=false;clearTimeout(DRAG.timer);
  return was?{col,id}:null;
}
document.addEventListener('pointerdown',e=>{
  if(e.button>0)return;const c=e.target.closest&&e.target.closest('.card[data-id]');if(!c||e.target.closest('button,a,input,select,textarea'))return;
  DRAG.el=c;DRAG.id=c.dataset.id;DRAG.pid=e.pointerId;DRAG.sx=e.clientX;DRAG.sy=e.clientY;DRAG.started=false;DRAG.touch=e.pointerType==='touch';
  clearTimeout(DRAG.timer);if(DRAG.touch){const x=e.clientX,y=e.clientY;DRAG.timer=setTimeout(()=>{if(DRAG.el&&!DRAG.started)dragStart(x,y)},300)}
});
document.addEventListener('pointermove',e=>{
  if(!DRAG.el||e.pointerId!==DRAG.pid)return;
  if(!DRAG.started){const d=Math.hypot(e.clientX-DRAG.sx,e.clientY-DRAG.sy);if(DRAG.touch){if(d>10){clearTimeout(DRAG.timer);DRAG.el=null}return}if(d<6)return;dragStart(e.clientX,e.clientY);return}
  dragMove(e.clientX,e.clientY);
});
document.addEventListener('touchmove',e=>{if(DRAG.started)e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',e=>{if(DRAG.el&&DRAG.touch)e.preventDefault()});
document.addEventListener('pointerup',e=>{
  if(!DRAG.el||e.pointerId!==DRAG.pid){return}
  const r=dragEnd();if(r){DRAG.suppress=true;setTimeout(()=>{DRAG.suppress=false},80);if(r.col&&r.col.dataset.col)moveMission(r.id,r.col.dataset.col)}
});
document.addEventListener('pointercancel',()=>{if(DRAG.el)dragEnd()});

tick();setInterval(tick,20000);

const h0=location.hash.slice(1);if(ROUTES.some(x=>x[0]===h0))S.route=h0;
if(!S.me)setTimeout(openWho,600);
boot();
